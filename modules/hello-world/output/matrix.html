<div>
    <svg
        viewBox="0 0 800 90000"
        preserveAspectRatio="xMidYMid meet"
        xmlns="http://www.w3.org/2000/svg"
        style="
        background: transparent;
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
        ">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2" result="coloredBlur" />
          <feMerge>
            <feMergeNode in="coloredBlur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <style>
        .matrix-column {
          font-family: monospace;
          font-size: 0.42rem;
        }
        .code-trail {
          fill: orange;
          filter: url(#glow);
        }
        .code-head {
          fill: lightblue;
          filter: url(#glow);
        }
      </style>

      <g class="matrix-column">
        <text x="50" y="0">
          <tspan class="code-trail" x="50" dy="1.2em">r</tspan>
          <tspan class="code-trail" x="50" dy="1.2em">o</tspan>
          <tspan class="code-trail" x="50" dy="1.2em">a</tspan>
          <tspan class="code-head" x="50" dy="1.2em">d</tspan>
          <tspan class="code-trail" x="50" dy="1.2em">y</tspan>
          <tspan class="code-trail" x="50" dy="1.2em">3</tspan>
          <tspan class="code-trail" x="50" dy="1.2em">?</tspan>
          <tspan class="code-head" x="50" dy="1.2em">*</tspan>
          <animateTransform
            attributeName="transform"
            type="translate"
            from="0,-200"
            to="0,1920"
            dur="2s"
            repeatCount="indefinite" />
        </text>
      </g>

      <g class="matrix-column">

          <tspan class="code-trail" x="150" dy="1.2em">y</tspan>

          <tspan class="code-head" x="50" dy="1.2em">(</tspan>

          <tspan class="code-head" x="150" dy="1.2em">2</tspan>

            type="translate"
            from="0,-300"
            to="0,1920"
            dur="3.5s"
